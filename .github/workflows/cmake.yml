# Parallel CI for the CMake-based _build (the make-based flow remains in
# .circleci/config.yml). Runs entirely with the CMake _build system:
# configure -> _build -> ctest -> install -> consumers.

name: cmake
on:
  push:
    branches: [master, "cmake-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.cc }}-${{ matrix.thr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        thr: [single, openmp, pthreads]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install _build tools
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq gcc g++ clang libomp-dev ninja-build python3-pip
          v=$(cmake --version 2>/dev/null | head -1 || true)
          case "$v" in
            "cmake version 4"*) ;;
            *) python3 -m pip install --user --quiet --break-system-packages cmake
               echo "$HOME/.local/bin" >> "$GITHUB_PATH"
               ;;
          esac
      - name: Configure
        run: |
          cmake -S . -B _build -G Ninja \
            -DBLIS_CONFIG=haswell -DBLIS_THREADING='${{ matrix.thr }}' \
            -DCMAKE_INSTALL_PREFIX="$PWD/_install"
      - name: Build
        run: cmake --build _build -j 4
      - name: Test (BLIS testsuite, fast)
        run: ctest --test-dir _build -R blis-test-fast --output-on-failure
      - name: Test (reference BLAS drivers)
        run: ctest --test-dir _build -L blastest --output-on-failure
      - name: Install
        run: cmake --install _build
      - name: Consumer via find_package
        run: |
          cat >main.c <<'EOF'
          #include "blis.h"
          int main(void){ return bli_info_get_version_str() == 0; }
          EOF
          mkdir -p consumer && mv main.c consumer/main.c
          cat >consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 4.0)
          project(consumer C)
          find_package(blis REQUIRED)
          add_executable(c main.c)
          target_link_libraries(c PRIVATE blis::blis)
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build consumer/build
          LD_LIBRARY_PATH="$PWD/_install/lib" ./consumer/build/c
      - name: Consumer via pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/_install/share/pkgconfig"
          cc $(pkg-config --cflags blis) consumer/main.c \
             $(pkg-config --libs blis) -lm -o consumer/pc
          LD_LIBRARY_PATH="$PWD/_install/lib" ./consumer/pc
      - name: Standalone testsuite against installed package
        run: |
          cmake -S testsuite -B ts-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build ts-build
          (cd testsuite && ../ts-build/test_libblis.x \
            -g input.general.fast -o input.operations.fast > ../output.testsuite)
          grep -q 'Exiting normally' output.testsuite
          ! grep -q FAILURE output.testsuite

  linux-configs:
    name: linux-config-${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [auto, x86_64, zen3, sandybridge, generic]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq gcc g++ clang libomp-dev ninja-build python3-pip
          v=$(cmake --version 2>/dev/null | head -1 || true)
          case "$v" in
            "cmake version 4"*) ;;
            *) python3 -m pip install --user --quiet --break-system-packages cmake
               echo "$HOME/.local/bin" >> "$GITHUB_PATH"
               ;;
          esac
      - name: Configure + build
        run: |
          cmake -S . -B _build -G Ninja -DBLIS_CONFIG=${{ matrix.config }} \
            -DBLIS_ENABLE_CBLAS=ON
          cmake --build _build -j 4
      - name: Test (fast)
        run: ctest --test-dir _build -R 'blis-test-(fast|mixed)' --output-on-failure

  linux-z15:
    name: linux-s390x-z15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools + cross toolchain
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq gcc g++ clang libomp-dev ninja-build python3-pip \
            gcc-s390x-linux-gnu g++-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
          v=$(cmake --version 2>/dev/null | head -1 || true)
          case "$v" in
            "cmake version 4"*) ;;
            *) python3 -m pip install --user --quiet --break-system-packages cmake
               echo "$HOME/.local/bin" >> "$GITHUB_PATH"
               ;;
          esac
      - name: Configure
        run: |
          cmake -S . -B _build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=s390x \
            -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++ \
            -DCMAKE_CROSSCOMPILING_EMULATOR='qemu-s390x;-cpu;max;-L;/usr/s390x-linux-gnu/' \
            -DCMAKE_FIND_ROOT_PATH=/usr/s390x-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
           -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DBLIS_CONFIG=z15 -DBLIS_ENABLE_CBLAS=ON \
            -DTESTSUITE_WRAPPER='qemu-s390x -cpu max -L /usr/s390x-linux-gnu/'
      - name: Build
        run: cmake --build _build -j 4
      - name: Test (BLIS testsuite, fast)
        run: ctest --test-dir _build -R blis-test-fast --output-on-failure
      - name: Test (reference BLAS drivers)
        run: ctest --test-dir _build -L blastest --output-on-failure

  macos:
    name: macos-${{ matrix.thr }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # Apple clang has no bundled OpenMP; keep single/pthreads only.
        thr: [single, pthreads]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          command -v ninja >/dev/null || brew install ninja
          v=$(cmake --version 2>/dev/null | head -1 || true)
          case "$v" in
            "cmake version 4"*) ;;
            *) python3 -m pip install --user --quiet --break-system-packages cmake
               echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
               ;;
          esac
      - name: Configure + build (firestorm = Apple Silicon)
        run: |
          cmake -S . -B _build -G Ninja -DBLIS_CONFIG=firestorm \
            -DBLIS_THREADING='${{ matrix.thr }}' -DBLIS_ENABLE_CBLAS=ON
          cmake --build _build -j 4
      - name: Test (fast)
        run: ctest --test-dir _build -R blis-test-fast --output-on-failure

  windows:
    name: windows-ucrt64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      # The testsuite parser rejects CRLF input files; keep LF as .circleci does.
      - run: git config --global core.autocrlf input
        shell: pwsh
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools (cmake 4)
        run: |
          v=$(cmake --version 2>/dev/null | head -1 || true)
          case "$v" in
            "cmake version 4"*) ;;
            *) python -m pip install --quiet cmake
               ;;
          esac
      - name: Configure + build
        run: |
          cmake --version
          cmake -S . -B _build -G Ninja -DBLIS_CONFIG=haswell \
            -DBLIS_THREADING=single -DBLIS_ENABLE_CBLAS=ON
          cmake --build _build -j 4
      - name: Test (fast)
        run: |
          export PATH="$PWD/_build/lib:$PATH"
          ctest --test-dir _build -R blis-test-fast --output-on-failure
